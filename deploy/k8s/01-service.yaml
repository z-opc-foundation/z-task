# ============================================================
# z-task —— Service（NodePort）
# 线上实况（/tmp/zdeploy-base/z-task.yaml 导出为准）：
#   Service  z-task-admin  NodePort  8082 → targetPort http  nodePort 31882
#   selector app.kubernetes.io/name=z-task-admin
#
# 端口与 NodePort 号**照抄线上**，不重新分配（改号会让既有调用方失联，收益为零）。
# ⚠ 容器端口 8082 = z-task-admin 的 application.yml 里 server.port: 8082。
#   （仓内 Dockerfile 另有一处 SERVER_PORT=8080 的历史写法，见 README §1 的说明。）
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: z-task-admin
  namespace: z-task
  labels:
    app.kubernetes.io/name: z-task-admin
    app.kubernetes.io/part-of: z-opc-foundation
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: z-task-admin
  ports:
    - name: http
      port: 8082
      targetPort: http
      nodePort: 31882
