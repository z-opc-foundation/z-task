# =============================================================================
# z-task 启动配置 (application.yml)
# 敏感项一律走环境变量, 仓库内不落真实地址/密钥.
# 业务方接入时, 复制此文件并改 z.base.db / sso 配置.
# =============================================================================

server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: z-task
  profiles:
    active: dev
  # SQL 会话工厂由 z-task-web TaskMyBatisConfig 手工装配 (z.base.db.task.*),
  # spring/druid/mybatis-plus 的自动装配会在其注册前抢跑, 一律排除
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# ------------------------------------------------------------
# 数据源: z-boot-datasource-starter ModuleDataSourceTemplate
# 模块键 z.base.db.task.* 缺省时逐项回退 z.base.db.default.*
# (SQL 会话工厂由 z-task-web TaskMyBatisConfig 手工装配,
#  不走 spring.datasource / mybatis-plus.* 自动配置)
# ------------------------------------------------------------
z:
  base:
    db:
      task:
        host: ${ZTASK_DB_HOST:127.0.0.1}
        port: ${ZTASK_DB_PORT:3306}
        database: ${ZTASK_DB_NAME:z_task}
        username: ${ZTASK_DB_USER:root}
        password: ${ZTASK_DB_PASSWORD:}

# ------------------------------------------------------------
# 4A 中心 SSO (z-ctc-sso): JWT 鉴权
# 注意: /api/sync-user/** 为服务端同步端点, 免鉴权 (已知风险, 见 README)
# ------------------------------------------------------------
sso:
  enabled: true
  token-cookie-name: zifang_token
  # SSO 排除路径 (不需要鉴权)
  exclude-paths:
    - /login
    - /api/auth/login
    - /api/auth/register
    - /api/sync-user/**
    - /doc.html
    - /v3/api-docs/**
    - /v2/api-docs/**
    - /swagger-resources/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /webjars/**
    - /favicon.ico
    - /error
  # SSO 拦截路径 (默认 /**, 即全部)
  intercept-paths:
    - /**
  login-url: /login

# Knife4j (z-boot-web-starter 自带 knife4j-openapi3)
knife4j:
  enable: true
  setting:
    language: zh_cn

# Logging (log4j2, z-boot-web-starter 默认)
logging:
  level:
    com.zifang.z.task: info
    com.zifang.ctc.audit: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
